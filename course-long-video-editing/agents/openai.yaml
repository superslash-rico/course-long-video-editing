interface:
  display_name: "课程长视频剪辑"
  short_description: "按阶段加载，先看公开样片再做本课动画对照；原件内批注、强运镜与实画验收"
  default_prompt: "使用 $course-long-video-editing 处理本次课程，复用已确认信息，读取当前本地工程；按完整内容设计真实素材动画，先运行阶段入口并查看匹配的公开样片，使用共享前景相机与原件批注组件；代表段实际导出对照后再扩展，遍历所有材料引用，完成原生合成、声音、字幕及逐项检查；录屏金句按实际背景适配，动画先交审核片，确认后再进入后续导出交付。未知标题先确认，已粗剪不再剪声，用户片头片尾与封面沿用。 来源说明条统一采用屏幕左下小字层。"
policy:
  allow_implicit_invocation: true
