<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: transparent; }
    .speaker-card { position: relative; width: 640px; height: 256px; color: #ffffff; font-family: MiSans; font-synthesis: none; }
    .card-body { position: absolute; left: 40px; top: 30px; width: 500px; height: 180px; display: flex; align-items: center; gap: 28px; transform-origin: 0 50%; }
    .signature-mark { position: relative; align-self: stretch; width: 16px; flex: none; margin: 11px 0 5px; background: #e802f8; transform-origin: 50% 50%; }
    .signature-mark-echo { position: absolute; left: -7px; top: 0; width: 4px; height: 100%; opacity: .26; background: #e802f8; }
    .copy { position: relative; display: flex; flex-direction: column; gap: 13px; max-width: 450px; padding-bottom: 6px; filter: drop-shadow(0 2px 5px rgba(0,0,0,.5)); }
    .name { font-size: 91px; font-weight: 700; letter-spacing: -.055em; line-height: 1.04; overflow-wrap: anywhere; }
    .name-line { position: absolute; left: 0; top: 102px; width: 224px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.6), rgba(255,255,255,0)); }
    .identity { font-size: 33px; font-weight: 400; line-height: 1.3; letter-spacing: .025em; color: #eee9f1; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="speaker-card">
    <div class="card-body">
      <div class="signature-mark"><span class="signature-mark-echo"></span></div>
      <div class="copy">
        <div class="name"></div>
        <span class="name-line"></span>
        <div class="identity"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import {defaults} from './defaults.js';
    const clamp = value => Math.max(0, Math.min(1, value));
    const ease = value => 1 - Math.pow(1 - clamp(value), 3);
    export default function mount({root, props}) {
      const card = root.querySelector('.speaker-card');
      const body = root.querySelector('.card-body');
      const mark = root.querySelector('.signature-mark');
      const echo = root.querySelector('.signature-mark-echo');
      const name = root.querySelector('.name');
      const identity = root.querySelector('.identity');
      let values = {...defaults,...(props||{})};
      function bind() {
        name.textContent = values.name;
        identity.textContent = values.identity;
        card.style.fontFamily = values.font;
        name.style.color = values.textColor;
        identity.style.color = values.identityColor;
        mark.style.backgroundColor = values.accentColor;
        echo.style.backgroundColor = values.accentColor;
      }
      bind();
      return {
        update({props}) { values = {...defaults,...(props||{})}; bind(); },
        render({timeSeconds}) {
          const t = Math.max(0, timeSeconds);
          const duration = Math.max(1, Number(values.seconds));
          const enter = ease(t / .48);
          const leave = ease((t - (duration - .42)) / .42);
          card.style.opacity = String(clamp(enter * (1 - leave)));
          name.style.opacity = String(ease((t - .10) / .40) * (1 - leave));
          identity.style.opacity = String(ease((t - .21) / .36) * (1 - leave));
          name.style.transform = `translateY(${(1 - ease((t - .10) / .40)) * 10 - leave * 4}px)`;
          identity.style.transform = `translateY(${(1 - ease((t - .21) / .36)) * 8 - leave * 4}px)`;
          body.style.transform = `translateX(${(1 - enter) * -12 - leave * 7}px)`;
          mark.style.transform = `skewX(-14deg) scaleY(${ease(t / .32) * (1 - leave)})`;
        },
        dispose() {}
      };
    }
  </script>
</body>
</html>
