<!doctype html>
<style>canvas{display:block;width:100%;height:100%}</style>
<canvas></canvas>
<script type="module">
// Portable derivative of the course's live-input morph. Coordinates are normalized;
// time is local seconds. This is authored framing, not automatic face tracking.
export default function mount({root,input,viewport,timeline,props}){
 const canvas=root.querySelector('canvas');
 canvas.width=viewport.width;canvas.height=viewport.height;
 const ctx=canvas.getContext('2d');
 if(!ctx)throw new Error('Live presenter circle requires Canvas 2D');
 let p={...props};
 const clamp=v=>Math.max(0,Math.min(1,v));
 const smooth=v=>{v=clamp(v);return v*v*v*(v*(v*6-15)+10);};
 const mix=(a,b,t)=>a+(b-a)*t;
 const num=(key,value)=>Number.isFinite(Number(p[key]))?Number(p[key]):value;
 return {
  update({props}){p={...props};},
  render({timeSeconds,frame,progress}){
   const duration=num('seconds',0)>0?num('seconds',0):timeline.durationInSeconds;
   if(!Number.isFinite(duration)||duration<=0)throw new Error('Actual effect duration in seconds is required');
   const t=Math.max(0,timeSeconds),w0=canvas.width,h0=canvas.height;
   ctx.resetTransform();ctx.clearRect(0,0,w0,h0);
   const finalFrame=Number.isFinite(frame)&&Number.isFinite(timeline.durationInFrames)&&frame>=timeline.durationInFrames-1;
   if(finalFrame||(Number.isFinite(progress)&&progress>=1)||t>=duration){ctx.drawImage(input,0,0,w0,h0);return;}
   const enterSeconds=Math.min(Math.max(.01,num('entranceSeconds',.8)),duration/3);
   const exitSeconds=Math.min(Math.max(.01,num('exitSeconds',.8)),duration/3);
   const k=smooth(t/enterSeconds)*(1-smooth((t-duration+exitSeconds)/exitSeconds));
   if(k<.000001){ctx.drawImage(input,0,0,w0,h0);return;}
   const route=smooth((t-num('moveStartSeconds',duration*.35))/Math.max(.01,num('moveSeconds',.8)));
   const d=Math.min(w0,h0)*Math.max(.08,Math.min(.6,num('diameterFraction',.26)));
   const centerX=Math.max(d/2,Math.min(w0-d/2,mix(num('startCenterX',.86),num('endCenterX',.14),route)*w0));
   const centerY=Math.max(d/2,Math.min(h0-d/2,mix(num('startCenterY',.72),num('endCenterY',.72),route)*h0));
   const w=mix(w0,d,k),h=mix(h0,d,k),x=mix(w0/2,centerX,k)-w/2,y=mix(h0/2,centerY,k)-h/2;
   const radius=Math.min(w,h)*.5*k;
   const iw=input.naturalWidth||input.width||w0,ih=input.naturalHeight||input.height||h0;
   const aspect=w/h;
   const cropH=Math.min(ih,iw/aspect,mix(ih,ih*Math.max(.1,Math.min(1,num('sourceHeight',.65))),k));
   const cropW=cropH*aspect;
   const cx=mix(iw*.5,iw*clamp(num('sourceCenterX',.5)),k),cy=mix(ih*.5,ih*clamp(num('sourceCenterY',.47)),k);
   const sx=Math.max(0,Math.min(iw-cropW,cx-cropW/2)),sy=Math.max(0,Math.min(ih-cropH,cy-cropH/2));
   ctx.save();ctx.shadowColor='rgba(0,0,0,'+(.3*k)+')';ctx.shadowBlur=22*k;ctx.shadowOffsetY=7*k;
   ctx.fillStyle='#0C0A14';ctx.beginPath();ctx.roundRect(x,y,w,h,radius);ctx.fill();ctx.restore();
   ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,radius);ctx.clip();
   ctx.drawImage(input,sx,sy,cropW,cropH,x,y,w,h);ctx.restore();
   ctx.save();ctx.globalAlpha=.55*k;ctx.strokeStyle=p.ringColor||'#F4A6FF';ctx.lineWidth=Math.max(1,Math.min(w0,h0)/540);
   ctx.beginPath();ctx.roundRect(x+1,y+1,w-2,h-2,Math.max(0,radius-1));ctx.stroke();ctx.restore();
  },
  dispose(){canvas.remove();}
 };
}
</script>
